<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qualification | Karthika Sundar</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Poppins', Arial, sans-serif;
      overflow-x: hidden;
      color: #fff;
      background-color: #000;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
    }

    header h1 {
      font-size: 1.4em;
      margin: 0;
      color: #f39c12;
    }

    /* NAVIGATION - Desktop */
    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9em;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #f39c12;
    }

    /* Hamburger menu - hidden on desktop */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: #fff;
      transition: 0.3s;
    }

    /* 📱 RESPONSIVE - Mobile Menu */
    @media (max-width: 900px) {
      .hamburger {
        display: flex;
      }

      nav {
        display: none; /* Hide links by default on mobile */
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.95);
        padding: 20px;
        text-align: center;
        gap: 15px;
      }

      nav.show {
        display: flex; /* Show links when hamburger is clicked */
      }
    }

    /* SECTION CONTENT */
    section {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 8%;
      z-index: 5;
    }

    section h2 {
      font-size: 3em;
      margin-bottom: 20px;
      color: #f39c12;
    }

    section p {
      font-size: 1.2em;
      margin: 10px 0;
      max-width: 650px;
      line-height: 1.6;
    }

    /* SLIDESHOW */
    .slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .slideshow img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .slideshow img.active {
      opacity: 0.6; /* Dimmed slightly for text readability */
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding: 15px;
      font-size: 0.8em;
      background: rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <header>
    <h1>Karthika Sundar</h1>

    <div class="hamburger" id="hamburger-menu">
      <div></div>
      <div></div>
      <div></div>
    </div>

    <nav id="nav-menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="qualification.html" style="color:#f39c12;">Qualification</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section>
    <h2>Qualification</h2>
    <p><b>BSc in Computer Science</b>, Mangalore University.</p>
    <p>Also completed a <b>Diploma in Video Editing</b>, combining technical expertise with creative storytelling in documentary filmmaking.</p>
  </section>

  <footer>
    <p>© 2026 Karthika Sundar. All rights reserved.</p>
  </footer>

  <div class="slideshow">
    <img src="Sources/1.jpg" class="active" alt="Slide 1">
    <img src="Sources/2.jpg" alt="Slide 2">
    <img src="Sources/3.jpg" alt="Slide 3">
  </div>

  <script>
    // 🍔 Hamburger Menu Logic
    const hamburger = document.getElementById('hamburger-menu');
    const nav = document.getElementById('nav-menu');

    hamburger.addEventListener('click', () => {
      nav.classList.toggle('show');
    });

    // 🔁 Background Slideshow
    const slides = document.querySelectorAll('.slideshow img');
    let current = 0;
    setInterval(() => {
      slides[current].classList.remove('active');
      current = (current + 1) % slides.length;
      slides[current].classList.add('active');
    }, 5000);
  </script>

</body>
</html>
